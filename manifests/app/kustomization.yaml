# Bookinfo (Istio samples), one version per service so latency is deterministic:
# productpage -> details, reviews-v3 -> ratings-v2 -> mongodb
# every call crosses nodes: productpage, ratings on zt-w1; details, reviews, mongodb on zt-w2
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bookinfo
resources:
  - namespace.yaml
  - upstream/bookinfo.yaml
  - upstream/bookinfo-db.yaml
  - upstream/bookinfo-ratings-v2.yaml
  - serviceaccounts.yaml
configMapGenerator:
  - name: mongodb-init
    files:
      - script.sh=mongodb-init.sh
patches:
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: reviews-v1
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: reviews-v2
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ratings-v1
  # SA of the removed ratings-v1
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: bookinfo-ratings
  # mongo entrypoint runs initdb only if the first arg is "mongod"; seed ratings from our script
  - target:
      kind: Deployment
      name: mongodb-v1
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args
        value: [mongod, --ipv6, --bind_ip_all]
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value: {name: init, mountPath: /docker-entrypoint-initdb.d}
      - op: add
        path: /spec/template/spec/volumes/-
        value: {name: init, configMap: {name: mongodb-init}}
      - op: add
        path: /spec/template/spec/serviceAccountName
        value: bookinfo-mongodb
      # upstream has no probe; Ready must mean mongod accepts connections
      - op: add
        path: /spec/template/spec/containers/0/readinessProbe
        value: {tcpSocket: {port: 27017}, periodSeconds: 2}
  - target:
      kind: Deployment
      name: productpage-v1|ratings-v2
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value: {kubernetes.io/hostname: lima-zt-w1}
  - target:
      kind: Deployment
      name: details-v1|reviews-v3|mongodb-v1
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value: {kubernetes.io/hostname: lima-zt-w2}
