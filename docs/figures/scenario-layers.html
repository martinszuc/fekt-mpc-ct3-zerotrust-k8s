<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Who can still read the ratings data?</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f3ee;
      --color-ink:     #111111;
      --color-muted:   #4a5468;
      --color-accent:  #de0024;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Compensating layers · MPC-CT3</p>
    <h1>Who can still read the ratings data?</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="scenario-layers-title scenario-layers-desc">
        <title id="scenario-layers-title">Who can still read the ratings data?</title>
        <desc id="scenario-layers-desc">Segmentation, mesh mTLS and L7 authorization each stop one class of workload from reading the ratings data, and a workload running with the legitimate ServiceAccount remains as residual risk that no scenario mitigates.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4a5468"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#de0024"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00399e"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f3ee"/>

        <!-- Escape carriers (behind boxes) -->
        <line x1="520" y1="64" x2="520" y2="104" stroke="#4a5468" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="520" y1="176" x2="520" y2="216" stroke="#4a5468" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="520" y1="288" x2="520" y2="328" stroke="#4a5468" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="520" y1="400" x2="520" y2="440" stroke="#de0024" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

        <rect x="528" y="78" width="56" height="12" rx="2" fill="#f5f3ee"/>
        <text x="556" y="87" fill="#5b6273" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EVERY POD</text>
        <rect x="528" y="190" width="72" height="12" rx="2" fill="#f5f3ee"/>
        <text x="564" y="199" fill="#5b6273" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">COPIED LABEL</text>
        <rect x="528" y="302" width="64" height="12" rx="2" fill="#f5f3ee"/>
        <text x="560" y="311" fill="#5b6273" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ANY MESH ID</text>
        <rect x="528" y="414" width="80" height="12" rx="2" fill="#f5f3ee"/>
        <text x="568" y="423" fill="#de0024" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LEGITIMATE SA</text>

        <!-- Input: S0 baseline -->
        <rect x="48" y="16" width="640" height="48" rx="6" fill="#f5f3ee"/>
        <rect x="48" y="16" width="640" height="48" rx="6" fill="rgba(74,84,104,0.10)" stroke="#5b6273" stroke-width="1"/>
        <rect x="56" y="24" width="28" height="12" rx="2" fill="transparent" stroke="rgba(91,98,115,0.50)" stroke-width="0.8"/>
        <text x="70" y="33" fill="#5b6273" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">S0</text>
        <text x="104" y="38" fill="#111111" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Any pod reads ratings and MongoDB</text>
        <text x="104" y="54" fill="#4a5468" font-size="9" font-family="'Geist Mono', monospace">baseline: Cilium only, no policies; MongoDB has no authentication</text>

        <!-- Layer S1 -->
        <rect x="48" y="104" width="640" height="72" rx="6" fill="#f5f3ee"/>
        <rect x="48" y="104" width="640" height="72" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1"/>
        <rect x="56" y="112" width="28" height="12" rx="2" fill="transparent" stroke="rgba(17,17,17,0.40)" stroke-width="0.8"/>
        <text x="70" y="121" fill="#111111" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">S1</text>
        <text x="104" y="136" fill="#111111" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Segmentation</text>
        <text x="104" y="152" fill="#4a5468" font-size="9" font-family="'Geist Mono', monospace">default-deny NetworkPolicy</text>
        <text x="312" y="136" fill="#4a5468" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">STOPS</text>
        <text x="368" y="136" fill="#111111" font-size="9" font-family="'Geist Mono', monospace">pods without the allowed label (T1)</text>
        <text x="312" y="156" fill="#4a5468" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">MISSES</text>
        <text x="368" y="156" fill="#111111" font-size="9" font-family="'Geist Mono', monospace">pod that copies app=reviews (T3)</text>

        <!-- Layer S2b -->
        <rect x="48" y="216" width="640" height="72" rx="6" fill="#f5f3ee"/>
        <rect x="48" y="216" width="640" height="72" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1"/>
        <rect x="56" y="224" width="28" height="12" rx="2" fill="transparent" stroke="rgba(17,17,17,0.40)" stroke-width="0.8"/>
        <text x="70" y="233" fill="#111111" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">S2B</text>
        <text x="104" y="248" fill="#111111" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Workload authentication</text>
        <text x="104" y="264" fill="#4a5468" font-size="9" font-family="'Geist Mono', monospace">Istio mTLS STRICT</text>
        <text x="312" y="248" fill="#4a5468" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">STOPS</text>
        <text x="368" y="248" fill="#111111" font-size="9" font-family="'Geist Mono', monospace">pods outside the mesh (T3 no-identity)</text>
        <text x="312" y="268" fill="#4a5468" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">MISSES</text>
        <text x="368" y="268" fill="#111111" font-size="9" font-family="'Geist Mono', monospace">any pod in the mesh, e.g. SA default</text>

        <!-- Layer S3 -->
        <rect x="48" y="328" width="640" height="72" rx="6" fill="#f5f3ee"/>
        <rect x="48" y="328" width="640" height="72" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1"/>
        <rect x="56" y="336" width="28" height="12" rx="2" fill="transparent" stroke="rgba(17,17,17,0.40)" stroke-width="0.8"/>
        <text x="70" y="345" fill="#111111" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">S3</text>
        <text x="680" y="345" fill="#5b6273" font-size="7" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.14em">EXPECTED · S3 NOT RUN YET</text>
        <text x="104" y="360" fill="#111111" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Authorization</text>
        <text x="104" y="376" fill="#4a5468" font-size="9" font-family="'Geist Mono', monospace">AuthorizationPolicy, L7</text>
        <text x="312" y="360" fill="#4a5468" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">STOPS</text>
        <text x="368" y="360" fill="#111111" font-size="9" font-family="'Geist Mono', monospace">wrong principal, wrong method (T3, T4)</text>
        <text x="312" y="380" fill="#4a5468" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">MISSES</text>
        <text x="368" y="380" fill="#111111" font-size="9" font-family="'Geist Mono', monospace">workload running as bookinfo-reviews</text>

        <!-- Residual risk (focal) -->
        <rect x="48" y="440" width="640" height="64" rx="6" fill="#f5f3ee"/>
        <rect x="48" y="440" width="640" height="64" rx="6" fill="rgba(222,0,36,0.07)" stroke="#de0024" stroke-width="1"/>
        <rect x="56" y="448" width="40" height="12" rx="2" fill="transparent" stroke="rgba(222,0,36,0.50)" stroke-width="0.8"/>
        <text x="76" y="457" fill="#de0024" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LIMIT</text>
        <text x="104" y="472" fill="#111111" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Residual: the legitimate identity reads ratings</text>
        <text x="104" y="490" fill="#4a5468" font-size="9" font-family="'Geist Mono', monospace">T3 reused-sa, T5 · needs admission control or RBAC on ServiceAccount use</text>

        <!-- Callout: S2a sibling -->
        <text x="720" y="234" fill="#111111" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">S2a (WireGuard) is the sibling</text>
        <text x="720" y="252" fill="#111111" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">of S2b: it hides the node link (T2)</text>
        <text x="720" y="270" fill="#111111" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">but authenticates nodes, not pods,</text>
        <text x="720" y="288" fill="#111111" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">so on this thread nothing changes.</text>
        <path d="M 716,229 Q 704,236 692,244" fill="none" stroke="rgba(17,17,17,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="692" cy="244" r="2" fill="#111111"/>

        <!-- Legend -->
        <line x1="48" y1="540" x2="912" y2="540" stroke="rgba(17,17,17,0.10)" stroke-width="0.8"/>
        <text x="48" y="564" fill="#4a5468" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="128" y="554" width="20" height="14" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1"/>
        <text x="156" y="564" fill="#4a5468" font-size="9" font-family="'Geist Mono', monospace">control added by the scenario</text>
        <line x1="360" y1="561" x2="392" y2="561" stroke="#4a5468" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="400" y="564" fill="#4a5468" font-size="9" font-family="'Geist Mono', monospace">what passes to the next layer</text>
        <rect x="600" y="554" width="20" height="14" rx="3" fill="rgba(222,0,36,0.07)" stroke="#de0024" stroke-width="1"/>
        <text x="628" y="564" fill="#4a5468" font-size="9" font-family="'Geist Mono', monospace">residual risk, not mitigated</text>
      </svg>
    </div>
  </div>
</body>
</html>
