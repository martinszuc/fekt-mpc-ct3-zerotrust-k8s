# attack tests on kind (no benchmarks: no real node link) and figures from the committed data
# tool versions as in docs/versions.md
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  KUBECTL_VERSION: v1.37.1
  HELM_VERSION: v4.3.1
  CILIUM_CLI_VERSION: v0.20.1
  KIND_VERSION: v0.33.0
  PYTHON_VERSION: 3.15.0

jobs:
  attack-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLo kubectl "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl"
          curl -fsSLo kind "https://kind.sigs.k8s.io/dl/$KIND_VERSION/kind-linux-amd64"
          curl -fsSL "https://get.helm.sh/helm-$HELM_VERSION-linux-amd64.tar.gz" | tar xz linux-amd64/helm
          curl -fsSL "https://github.com/cilium/cilium-cli/releases/download/$CILIUM_CLI_VERSION/cilium-linux-amd64.tar.gz" | tar xz cilium
          sudo install -m 0755 kubectl kind linux-amd64/helm cilium /usr/local/bin/
          # tshark from Ubuntu 24.04 (4.2.x, host has 4.6.9); only reads the captures
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq tshark >/dev/null
          # kind with three nodes runs out of inotify instances at the runner default
          sudo sysctl -q fs.inotify.max_user_instances=512 fs.inotify.max_user_watches=524288
          kubectl version --client; helm version --short; cilium version --client; kind version; tshark --version | head -1
      - name: Node access for kind
        run: sed -n 's/^export //p' infra/kind.env >> "$GITHUB_ENV"
      - name: Cluster
        run: infra/up-kind.sh
      - name: App
        run: make app
      - name: Attack tests in every configuration
        run: |
          set -uo pipefail
          rc=0
          # same order as infra/reproduce.sh
          for s in S0 S1 S2a S2b S3; do
            echo "::group::$s"
            infra/scenario.sh "$s" && tests/run.sh || rc=1
            echo "::endgroup::"
          done
          exit $rc
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attack-results
          path: results/
          retention-days: 14

  plot:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Figures (make plot)
        if: runner.os == 'Linux'
        run: make plot deltas
      # same commands as make plot and make deltas, without make and the venv
      - name: Figures (python)
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          python -m pip install -q -r scripts/requirements.txt
          mk() { sed -n "s/^$1 [:?]= //p" Makefile | tr -d '\r'; }
          run_id=$(mk REPORT_RUN_ID) drop=$(mk REPORT_DROP)
          python scripts/aggregate.py --in results/bench --run-id "$run_id" --drop "$drop"
          python scripts/plot.py --in results/bench --out docs/figures/bench --run-id "$run_id" --drop "$drop"
          python scripts/paired.py --in results/bench --run-id "$(mk LATENCY_RUN)"
      - name: Summary CSVs match the committed ones
        run: git diff --ignore-cr-at-eol --exit-code --stat -- results/bench
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: figures-${{ matrix.os }}
          path: docs/figures/bench/
          retention-days: 14
